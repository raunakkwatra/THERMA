<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THERMA — Urban Heat Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13;
  --panel:#12161f;
  --panel-2:#171c27;
  --line:#232a38;
  --text:#eceff4;
  --muted:#8993a6;
  --muted-2:#5d6579;
  --blue:#2e6fe8;
  --teal:#2da3b2;
  --amber:#f2b705;
  --orange:#e8582e;
  --crimson:#8b1e3f;
  --green:#35c48c;
  --red:#e8432e;
  --focus:#6fb8ff;
  --radius:10px;
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
::selection{background:var(--orange);color:#fff;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}

/* ---------- layout shells ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px;width:100%;}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(10,13,19,0.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;height:66px;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.02em;background:none;border:none;color:var(--text);padding:0;}
.brand-mark{width:26px;height:26px;flex:none;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.pill-btn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:9px 16px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:500;
  transition:border-color .15s, background .15s;
}
.pill-btn:hover{border-color:var(--muted-2);background:var(--panel-2);}
.pill-btn.ghost{background:transparent;}

/* ---------- landing ---------- */
.hero{padding:88px 0 64px;position:relative;overflow:hidden;}
.hero-grain{position:absolute;inset:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(circle at 15% 20%, rgba(46,111,232,0.14), transparent 40%),
                    radial-gradient(circle at 85% 15%, rgba(232,88,46,0.12), transparent 45%),
                    radial-gradient(circle at 60% 80%, rgba(242,183,5,0.08), transparent 40%);
}
.eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--muted);
  display:flex;align-items:center;gap:10px;margin-bottom:22px;
}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(232,88,46,0.18);}
.hero h1{
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:clamp(34px,5.4vw,64px);
  line-height:1.05;
  letter-spacing:-0.015em;
  margin:0 0 22px;
  max-width:16ch;
  background:linear-gradient(100deg,#eceff4 30%, var(--amber) 58%, var(--orange) 78%, var(--crimson) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p.lead{font-size:17px;line-height:1.6;color:var(--muted);max-width:52ch;margin:0 0 36px;}
.portal-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;position:relative;z-index:1;}
@media (max-width:760px){.portal-row{grid-template-columns:1fr;}}
.portal-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px 26px 24px;
  position:relative;
  overflow:hidden;
  transition:border-color .18s, transform .18s;
}
.portal-card:hover{border-color:var(--muted-2);transform:translateY(-2px);}
.portal-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
}
.portal-card.citizen::before{background:linear-gradient(90deg,var(--teal),var(--green));}
.portal-card.planner::before{background:linear-gradient(90deg,var(--amber),var(--orange));}
.portal-icon{width:38px;height:38px;margin-bottom:16px;}
.portal-card h3{font-family:'Space Grotesk',sans-serif;font-size:21px;margin:0 0 8px;}
.portal-card p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 22px;min-height:66px;}
.enter-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--text);color:#0a0d13;
  border:none;border-radius:8px;
  padding:11px 18px;font-weight:600;font-size:14px;
  transition:opacity .15s;
}
.enter-btn:hover{opacity:.85;}
.enter-btn svg{width:15px;height:15px;}

.section-label{
  font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--muted-2);margin-bottom:10px;
}
.dash-preview{margin-top:76px;}
.dash-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.dash-head h2{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:0;}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media (max-width:820px){.metric-grid{grid-template-columns:1fr 1fr;}}
.metric-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 18px 16px;
}
.metric-card .m-label{font-size:12px;color:var(--muted);margin-bottom:10px;}
.metric-card .m-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:600;}
.metric-card .m-delta{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px;}
.m-delta.down{color:var(--green);}
.m-delta.up{color:var(--red);}
.impact-link{margin-top:22px;}

footer.site-footer{margin-top:auto;border-top:1px solid var(--line);padding:26px 0;color:var(--muted-2);font-size:12.5px;}

/* ---------- portal shells (citizen/planner) ---------- */
.portal-header{
  border-bottom:1px solid var(--line);
  padding:20px 0;
}
.portal-header-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.portal-title{display:flex;align-items:center;gap:12px;}
.portal-title .badge{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;border:1px solid var(--line);color:var(--muted);
}
.portal-title h2{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0;}
.controls-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-box{position:relative;}
.search-box input{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:9px 13px 9px 34px;font-size:13.5px;width:190px;
}
.search-box input:focus{border-color:var(--focus);}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted-2);}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;}
.seg button{
  background:transparent;border:none;color:var(--muted);font-size:12.5px;font-weight:500;
  padding:7px 12px;border-radius:6px;
}
.seg button.active{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line);}

.portal-body{padding:26px 0 60px;flex:1;}
.portal-grid{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start;}
@media (max-width:980px){.portal-grid{grid-template-columns:1fr;}}

/* ---------- heatmap panel ---------- */
.map-panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;position:relative;
}
.map-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.map-panel-head h4{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0;}
.legend{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.hexwrap{position:relative;border-radius:8px;overflow:hidden;background:
  radial-gradient(ellipse at 50% 0%, #151b26 0%, #0d1119 78%);
}
.hexwrap svg{display:block;width:100%;height:auto;}
.hexcell{cursor:pointer;stroke:#080a10;stroke-width:1.4;transition:opacity .12s, filter .12s;}
.hexcell:hover{filter:brightness(1.18);}
.hexcell.selected{stroke:#fff;stroke-width:2.4;}
.reticle{pointer-events:none;}
.tooltip{
  position:absolute;pointer-events:none;z-index:20;
  background:#05070b;border:1px solid #2b3346;border-radius:6px;
  padding:8px 11px;font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.6;
  color:#d7ecff;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
.tooltip .tt-title{color:#8bd6ff;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;}
.tooltip .tt-row b{color:#fff;}

/* ---------- side panel ---------- */
.side-panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;min-height:420px;
}
.side-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:376px;color:var(--muted-2);gap:12px;}
.side-empty svg{width:34px;height:34px;opacity:.5;}
.side-empty p{margin:0;font-size:13.5px;max-width:22ch;}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:376px;gap:16px;}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #232a38;border-top-color:var(--orange);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-state p{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted);letter-spacing:.03em;}

.risk-badge{display:inline-flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:6px;font-weight:600;}
.risk-badge.red{background:rgba(232,67,46,0.14);color:#ff8b73;}
.risk-badge.orange{background:rgba(242,183,5,0.14);color:#f4c341;}
.risk-badge.green{background:rgba(53,196,140,0.14);color:#5ee0aa;}
.risk-badge .rdot{width:7px;height:7px;border-radius:50%;background:currentColor;}

.readout-row{display:flex;gap:0;margin:16px 0 18px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.readout-cell{flex:1;padding:11px 8px;text-align:center;border-right:1px solid var(--line);}
.readout-cell:last-child{border-right:none;}
.readout-cell .r-label{font-size:10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.readout-cell .r-value{font-family:'JetBrains Mono',monospace;font-size:16.5px;font-weight:600;}

.side-block{margin-bottom:20px;}
.side-block h5{font-family:'Space Grotesk',sans-serif;font-size:13.5px;margin:0 0 8px;display:flex;align-items:center;gap:7px;color:var(--text);}
.side-block h5 .sq{width:4px;height:14px;background:var(--orange);border-radius:2px;display:inline-block;}
.side-block p{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 6px;}
.stat-inline{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.stat-chip{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--panel-2);border:1px solid var(--line);padding:4px 9px;border-radius:5px;color:var(--muted);}
.proj-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line);}
.proj-row:last-child{border-bottom:none;}
.status-tag{font-size:10.5px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;text-transform:uppercase;}
.status-tag.ongoing{background:rgba(242,183,5,0.14);color:#f4c341;}
.status-tag.completed{background:rgba(53,196,140,0.14);color:#5ee0aa;}
.solution-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;}
.solution-card .s-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.solution-card .s-name{font-size:13px;font-weight:600;}
.solution-card .s-red{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--green);white-space:nowrap;}
.solution-card .s-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
.close-panel{width:100%;margin-top:6px;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px;font-size:12.5px;}
.close-panel:hover{color:var(--text);border-color:var(--muted-2);}

/* ---------- planner specific ---------- */
.law-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.law-tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;}
.law-tab.active{background:var(--text);color:#0a0d13;border-color:var(--text);}
.law-list{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;}
.law-list h4{font-family:'Space Grotesk',sans-serif;font-size:14.5px;margin:0 0 12px;color:var(--muted);}
.law-list ol{margin:0;padding-left:20px;}
.law-list li{font-size:13.5px;line-height:1.7;color:var(--text);margin-bottom:4px;}

.upload-zone{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;margin:14px 0;transition:border-color .15s;}
.upload-zone.ok{border-color:var(--green);background:rgba(53,196,140,0.06);}
.upload-zone.err{border-color:var(--red);background:rgba(232,67,46,0.06);}
.upload-zone input[type=file]{display:none;}
.upload-label{display:inline-flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:500;}
.upload-label:hover{border-color:var(--muted-2);}
.upload-msg{font-size:11.5px;margin-top:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.upload-msg.ok{color:var(--green);}
.upload-msg.err{color:var(--red);}
.sample-link{background:none;border:none;color:var(--focus);font-size:11.5px;text-decoration:underline;padding:0;margin-top:8px;}

.analyze-btn{width:100%;background:linear-gradient(90deg,var(--amber),var(--orange));color:#181008;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:14px;margin-top:6px;}
.analyze-btn:disabled{background:var(--panel-2);color:var(--muted-2);cursor:not-allowed;}
.analyze-btn:not(:disabled):hover{filter:brightness(1.06);}

.score-wrap{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.score-ring{position:relative;width:76px;height:76px;flex:none;}
.score-ring svg{transform:rotate(-90deg);}
.score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;}
.score-meta .rating{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;margin-bottom:3px;}
.score-meta p{margin:0;font-size:12px;color:var(--muted);}

.rule-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.rule-row:last-child{border-bottom:none;}
.rule-icon{flex:none;width:17px;height:17px;margin-top:1px;}
.rule-text{font-size:12.8px;line-height:1.55;}
.rule-text b{display:block;color:var(--text);margin-bottom:2px;}
.rule-text span{color:var(--muted);}
.rule-text .fix{color:#f4c341;display:block;margin-top:3px;}

/* ---------- global dash strip within portal ---------- */
.global-strip{margin-top:32px;}
.global-strip .metric-grid{margin-bottom:16px;}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,6,10,0.72);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:86vh;overflow-y:auto;padding:28px 30px 30px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.modal-head h3{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 6px;}
.modal-head p{color:var(--muted);font-size:13px;margin:0;}
.modal-close{background:var(--panel-2);border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
@media (max-width:600px){.compare-row{grid-template-columns:1fr;}}
.compare-card{border:1px solid var(--line);border-radius:10px;padding:16px;}
.compare-card .c-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-2);margin-bottom:10px;}
.mini-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:12px;}
.mini-cell{aspect-ratio:1;border-radius:2px;}
.compare-card .c-temp{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;}
.impact-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:600px){.impact-stats{grid-template-columns:1fr;}}
.impact-stats .i-card{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:14px;}
.impact-stats .i-label{font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.impact-stats .i-val{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;color:var(--green);}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* =========================================================================
   THERMA — Urban Heat Intelligence (single-file demo app, mock data only)
   ========================================================================= */

/* ---------------- seeded RNG ---------------- */
function strSeed(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function rrange(rng,min,max){return min+rng()*(max-min);}
function rpick(rng,arr){return arr[Math.floor(rng()*arr.length)];}

/* ---------------- solutions catalog ---------------- */
const SOLUTIONS = {
  trees:{name:'Trees & Green Corridors',desc:'Add trees and connected green corridors in high-heat zones and along major roads.',base:1.6,citizen:'Ask your ward office to plant a street-side tree corridor — even a few connected trees measurably cool a lane.'},
  pavement:{name:'Cool / Reflective Pavements',desc:'Replace high heat-absorbing pavement with cool or reflective pavement in selected hotspots.',base:1.0,citizen:'Support resurfacing of dark asphalt footpaths near you with lighter, reflective material.'},
  parking:{name:'Green Parking Lots',desc:'Use permeable or shaded parking surfaces and add tree cover to large parking areas.',base:0.8,citizen:'If you manage or use a large parking area, push for shade trees and permeable paving.'},
  solarcanopy:{name:'Solar Parking Canopies',desc:'Install solar parking canopies that provide shade while generating renewable energy.',base:1.3,citizen:'Propose solar shade canopies for open parking near markets or offices in your area.'},
  greenroof:{name:'Green Roofs',desc:'Convert suitable rooftops into green roofs using vegetation and soil layers to reduce rooftop heat absorption.',base:1.4,citizen:'Start small — a rooftop kitchen garden or vegetated patch noticeably cools the room below.'},
  coolroof:{name:'Cool / Reflective Roofs',desc:'Apply cool or high-reflectance roof coatings on suitable buildings to reduce solar heat absorption.',base:1.7,citizen:'A white or reflective roof coating is a low-cost step you can take on your own rooftop.'},
  industrial:{name:'Industrial Heat Mitigation Package',desc:'Cool roofs, rooftop solar where suitable, green buffers, and reflective surfaces for industrial sheds.',base:2.0,citizen:'If a nearby industrial unit affects your area, raise the heat-load with local authorities.'},
  transit:{name:'Heat-Resilient Public Transport Zones',desc:'Create shaded public transport zones using tree canopies, shaded structures, and lower-heat surface materials.',base:1.1,citizen:'Request shaded waiting structures at your nearest bus stop or transit point.'},
  residentialcooling:{name:'Residential Cooling',desc:'Promote rooftop gardens and distributed pocket parks in dense residential areas.',base:1.2,citizen:'Turn unused rooftop or balcony space into a small green patch — distributed greenery adds up.'},
  ventilation:{name:'Ventilation / Open Space Corridors',desc:'Preserve open spaces and ventilation corridors in dense developments to support natural airflow and reduce trapped heat.',base:0.9,citizen:'Oppose infill construction that blocks the last open lane or airflow gap on your street.'},
  shadecorridor:{name:'Smart Shade Corridors',desc:'Identify high pedestrian heat-exposure routes and add targeted shade corridors using trees or structures.',base:1.0,citizen:'Flag high-footfall, shade-less stretches (near markets, schools) for a targeted shade corridor.'}

const ZONE_TYPES=['residential','commercial','industrial','transport','mixed'];
const ZONE_WEIGHT={residential:0.36,commercial:0.24,industrial:0.14,transport:0.08,mixed:0.18};
function pickZone(rng){
  const r=rng();let acc=0;
  for(const z of ZONE_TYPES){acc+=ZONE_WEIGHT[z];if(r<=acc)return z;}
  return 'mixed';
}
const COLS=9, ROWS=6, HEX_SIZE=27;

const PROBLEM_TEXT = {
  lowtree:'Very low tree canopy leaves surfaces exposed to direct sun for most of the day.',
  highdensity:'Dense, closely-packed built form traps heat and blocks night-time cooling.',
  highimpervious:'A high share of dark, impervious surface absorbs and re-radiates heat long after sunset.',
  lowalbedo:'Roofs with low reflectance absorb most incoming solar radiation.',
  poorvent:'Building layout leaves little room for cross-ventilation, so hot air stays trapped.',
  general:'A mix of low green cover and dense construction keeps this pocket consistently hotter than its surroundings.'
};
function mainProblemFor(h){
  if(h.treeCover<14) return PROBLEM_TEXT.lowtree;
  if(h.builtDensity>82) return PROBLEM_TEXT.highdensity;
  if(h.imperviousSurface>75) return PROBLEM_TEXT.highimpervious;
  if(h.roofAlbedo<0.22) return PROBLEM_TEXT.lowalbedo;
  if(h.builtDensity>72 && h.treeCover<20) return PROBLEM_TEXT.poorvent;
  return PROBLEM_TEXT.general;
}

function generateCity(key){
  const meta=CITY_META[key];
  const rng=mulberry32(strSeed(key+'-therma-v1'));
  const hexes=[];
  let id=0;
  for(let col=0; col<COLS; col++){
    for(let row=0; row<ROWS; row++){
      const zoneType=pickZone(rng);
      const treeCover=Math.round(rrange(rng, zoneType==='industrial'?4:8, zoneType==='residential'?42:30));
      const greenCover=Math.round(treeCover+rrange(rng,0,10));
      const builtDensity=Math.round(rrange(rng, zoneType==='industrial'?55:35, zoneType==='commercial'?92:zoneType==='industrial'?90:80));
      const roofAlbedo=+rrange(rng,0.14,0.5).toFixed(2);
      const imperviousSurface=Math.round(rrange(rng, zoneType==='commercial'?55:40, zoneType==='industrial'?92:80));
      const footfall=(zoneType==='transport'||zoneType==='commercial')?(rng()<0.7?'high':'medium'):(rng()<0.25?'medium':'low');
      const zoneOffset={residential:0,commercial:1.4,industrial:2.6,transport:1.1,mixed:0.8}[zoneType];
      const tempNoise=rrange(rng,-2.4,2.6);
      const baseTemp=+(meta.tempBase+zoneOffset+tempNoise - (treeCover*0.045) + (builtDensity*0.02)).toFixed(1);
      const aqiBase=Math.round(rrange(rng, zoneType==='industrial'?95:60, zoneType==='industrial'?210:150));
      const humidityBase=Math.round(rrange(rng,22,48));
      const hasProject=rng()<0.32;
      const projStatus=hasProject?(rng()<0.5?'ongoing':'completed'):null;
      const projPool=['Neighbourhood Tree Corridor','Cool Roof Retrofit Pilot','Permeable Pavement Trial','Pocket Park Development','Shaded Transit Shelter Upgrade','Green Buffer Plantation'];
      const projName=hasProject?rpick(rng,projPool):null;
      const tempVarMin=+rrange(rng,1.2,3.0).toFixed(1);
      const tempVarMax=+rrange(rng,1.4,3.4).toFixed(1);
      const h={
        id:id++, col,row, zoneType, treeCover:Math.max(2,treeCover), greenCover:Math.max(3,Math.min(65,greenCover)),
        builtDensity:Math.min(96,builtDensity), roofAlbedo, imperviousSurface:Math.min(94,imperviousSurface),
        footfall, baseTemp, aqiBase, humidityBase, hasProject, projStatus, projName,
        tempVarMin, tempVarMax
      };
      h.mainProblem=mainProblemFor(h);
      hexes.push(h);
    }
  }
  return {key, name:meta.name, state:meta.state, hexes};
}
const CITY_CACHE={};
function getCity(key){ if(!CITY_CACHE[key]) CITY_CACHE[key]=generateCity(key); return CITY_CACHE[key]; }

/* ---------------- season adjustment ---------------- */
const SEASONS={
  summer:{label:'Summer',dT:0,dH:0,dA:0},
  monsoon:{label:'Monsoon',dT:-5.5,dH:28,dA:-30},
  winter:{label:'Winter',dT:-9.5,dH:-8,dA:14}
};
function seasonAdjust(h,season){
  const s=SEASONS[season];
  const temp=+(h.baseTemp+s.dT).toFixed(1);
  const humidity=Math.max(8,Math.min(96,Math.round(h.humidityBase+s.dH)));
  const aqi=Math.max(20,Math.round(h.aqiBase+s.dA));
  return {temp,humidity,aqi,min:+(temp-h.tempVarMin).toFixed(1),max:+(temp+h.tempVarMax).toFixed(1)};
}
function riskLevel(temp,aqi){
  if(temp>=42||aqi>=200) return 'red';
  if(temp>=38||aqi>=100) return 'orange';
  return 'green';
}
function riskLabel(r){return r==='red'?'High Risk':r==='orange'?'Moderate Risk':'Low Risk';}

/* ---------------- temp -> thermal color ---------------- */
const STOPS=[
  {t:29,c:[46,111,232]},
  {t:34,c:[45,163,178]},
  {t:38,c:[242,183,5]},
  {t:42,c:[232,88,46]},
  {t:47,c:[139,30,63]}
];
function tempToColor(t){
  t=Math.max(STOPS[0].t,Math.min(STOPS[STOPS.length-1].t,t));
  for(let i=0;i<STOPS.length-1;i++){
    const a=STOPS[i], b=STOPS[i+1];
    if(t>=a.t&&t<=b.t){
      const f=(t-a.t)/(b.t-a.t);
      const c=a.c.map((v,idx)=>Math.round(v+(b.c[idx]-v)*f));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
  }
  return 'rgb(139,30,63)';
}

/* ---------------- recommendation engine ---------------- */
function recommendSolutions(h, adj){
  const recs=[]; const add=(id)=>{ if(!recs.includes(id)) recs.push(id); };
  if(h.treeCover<15 && adj.temp>42) add('trees');
  if(h.roofAlbedo<0.30 && h.builtDensity>70) add('coolroof');
  if(h.imperviousSurface>70) add('pavement');
  if(h.zoneType==='commercial' && h.imperviousSurface>60) add('parking');
  if((h.zoneType==='commercial'||h.zoneType==='transport') && h.footfall==='high') add('solarcanopy');
  if(h.zoneType==='industrial') add('industrial');
  if(h.zoneType==='transport' || h.footfall==='high') add('transit');
  if(h.zoneType==='residential' && h.greenCover<20) add('residentialcooling');
  if(h.builtDensity>80) add('ventilation');
  if(h.footfall==='high' && h.treeCover<20) add('shadecorridor');
  if(recs.length<2){ add('greenroof'); add('shadecorridor'); }
  return recs.slice(0,4).map((id,i)=>{
    const rng=mulberry32(strSeed(h.id+'-'+id));
    const reduction=+(SOLUTIONS[id].base + rrange(rng,-0.25,0.35)).toFixed(1);
    return {id, ...SOLUTIONS[id], reduction};
  });
}

function globalMetrics(){
  const city=getCity(state.city);
  const temps=city.hexes.map(h=>seasonAdjust(h,state.season).temp);
  const avg=+(temps.reduce((a,b)=>a+b,0)/temps.length).toFixed(1);
  const ongoing=city.hexes.filter(h=>h.projStatus==='ongoing').length;
  const completed=city.hexes.filter(h=>h.projStatus==='completed').length;
  const reduction=+(completed*0.28+ongoing*0.09).toFixed(1);
  const energy=Math.round(1180 - completed*14 + ongoing*3);
  return {avg,ongoing,completed,reduction,energy};
}

        <div class="metric-grid">
          ${metricCard('Avg. surface temperature', m.avg+'°C','−'+(m.reduction+0.4).toFixed(1)+'°C vs. last year','down')}
          ${metricCard('Temperature reduction to date', m.reduction+'°C','from '+m.completed+' completed projects','down')}
          ${metricCard('Active mitigation projects', m.ongoing+' ongoing','+'+m.completed+' completed','down')}
          ${metricCard('Cooling-linked energy demand', m.energy+' GWh','−'+Math.round(m.completed*1.1)+'% from baseline','down')}
        </div>
        <div class="impact-link">
          <button class="pill-btn" onclick="openModal('impact')">View Before / After Impact Report ${ICONS.arrow}</button>
        </div>
      </div>
    </div>
  </section>
  <footer class="site-footer"><div class="wrap">THERMA is a demonstration interface. All temperatures, risk levels, rule checks and compliance scores are generated from mock/deterministic logic, not live sensor or satellite data.</div></footer>
  `;
}
function metricCard(label,value,delta,dir){
  return `<div class="metric-card"><div class="m-label">${label}</div><div class="m-value">${value}</div><div class="m-delta ${dir}">${ICONS.down} ${delta}</div></div>`;
}
function citySearchHtml(){
  return `<div class="search-box">${ICONS.search}<input list="city-list" id="citySearchInput" placeholder="Search a city…" value="${getCity(state.city).name}" onchange="onCitySearch(this.value)"/></div>
  <datalist id="city-list">${Object.keys(CITY_META).map(k=>`<option value="${CITY_META[k].name}">`).join('')}</datalist>`;
}
function onCitySearch(rawVal){
  const val=String(rawVal).replace(/[<>&"]/g,'').trim();
  if(!val) return;
  let found=Object.keys(CITY_META).find(k=>CITY_META[k].name.toLowerCase()===val.toLowerCase());
  if(!found){
    /* Not in the curated list — generate a deterministic profile for
       whatever location was typed, so any place in the world works,
       not just the ~140 pre-listed cities. */
    const key='custom-'+val.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    if(!CITY_META[key]){
      const rng=mulberry32(strSeed(val.toLowerCase()));
      CITY_META[key]={name:val, country:'', tempBase:+rrange(rng,29,45).toFixed(1)};
    }
    found=key;
  }
  setState({city:found, selectedHexId:null, plannerResult:null});
}

/* ---------------- rendering: hex heatmap (shared) ---------------- */
function hexPoints(cx,cy,size){
  const pts=[];
  for(let i=0;i<6;i++){
    const ang=Math.PI/180*(60*i);
    pts.push(`${(cx+size*Math.cos(ang)).toFixed(1)},${(cy+size*Math.sin(ang)).toFixed(1)}`);
  }
  return pts.join(' ');
}
function renderHeatmap(){
  const city=getCity(state.city);
  const hexW=HEX_SIZE*2, hexH=Math.sqrt(3)*HEX_SIZE;
  const horiz=hexW*0.75;
  const vbW=Math.ceil(COLS*horiz+hexW*0.5+10);
  const vbH=Math.ceil(ROWS*hexH+hexH*0.6+10);
  let cells='';
  city.hexes.forEach(h=>{
    const cx=8+h.col*horiz+HEX_SIZE;
    const cy=8+h.row*hexH+(h.col%2?hexH/2:0)+HEX_SIZE*0.6;
    const adj=seasonAdjust(h,state.season);
    const color=tempToColor(adj.temp);
    const sel=state.selectedHexId===h.id?' selected':'';
    cells+=`<polygon class="hexcell${sel}" points="${hexPoints(cx,cy,HEX_SIZE-1.5)}" fill="${color}"
      onmousemove="onHexHover(event, ${h.id})" onmouseleave="onHexLeave()" onclick="onHexClick(${h.id})"
      role="button" tabindex="0" aria-label="Hex ${h.id}, ${adj.temp}°C, ${riskLabel(riskLevel(adj.temp,adj.aqi))}"></polygon>`;
  });
  return `<div class="hexwrap" id="hexwrap" onmouseleave="onHexLeave()">
    <svg viewBox="0 0 ${vbW} ${vbH}" xmlns="http://www.w3.org/2000/svg">${cells}</svg>
    ${state.tooltip?renderTooltip():''}
  </div>`;
}
function renderTooltip(){
  const t=state.tooltip;
  return `<div class="tooltip" style="left:${t.x}px; top:${t.y}px;">
    <div class="tt-title">Hex ${String(t.h.id).padStart(3,'0')} · ${t.h.zoneType}</div>
    <div class="tt-row">TEMP <b>${t.adj.temp}°C</b></div>
    <div class="tt-row">MIN ${t.adj.min}°C&nbsp;&nbsp;MAX ${t.adj.max}°C</div>
    <div class="tt-row">AQI ${t.adj.aqi}&nbsp;&nbsp;HUM ${t.adj.humidity}%</div>
  </div>`;
}
function onHexHover(ev,hexId){
  const city=getCity(state.city);
  const h=city.hexes.find(x=>x.id===hexId);
  const adj=seasonAdjust(h,state.season);
  const wrap=document.getElementById('hexwrap');
  const rect=wrap.getBoundingClientRect();
  let x=ev.clientX-rect.left+14, y=ev.clientY-rect.top+14;
  if(x>rect.width-160) x=ev.clientX-rect.left-160;
  state.tooltip={x,y,h,adj};
  const existing=wrap.querySelector('.tooltip');
  if(existing) existing.remove();
  wrap.insertAdjacentHTML('beforeend', renderTooltip());
}
function onHexLeave(){
  state.tooltip=null;
  const wrap=document.getElementById('hexwrap');
  const existing=wrap&&wrap.querySelector('.tooltip');
  if(existing) existing.remove();
}
function onHexClick(hexId){
  state.selectedHexId=hexId;
  state.plannerResult=null;
  state.dwfStatus=null; state.dwfName=null;
  if(state.route==='citizen'){
    state.analyzing=true;
    render();
    setTimeout(()=>{ state.analyzing=false; render(); }, 900);
  } else {
    render();
  }
}

/* ---------------- citizen portal ---------------- */
function renderCitizen(){
  const city=getCity(state.city);
  const m=globalMetrics();
  return `
  ${renderTopbar('Citizen')}
  <div class="portal-header"><div class="wrap portal-header-inner">
    <div class="portal-title"><span class="badge">${ICONS.person} CITIZEN</span><h2>${city.name} heat map</h2></div>
    <div class="controls-row">
      ${citySearchHtml()}
      ${seasonSeg()}
    </div>
  </div></div>
  <div class="portal-body"><div class="wrap">
    <div class="portal-grid">
      <div class="map-panel">
        <div class="map-panel-head">
          <h4>Live thermal grid — ${SEASONS[state.season].label}</h4>
          <div class="legend">
            <span><i style="background:var(--green)"></i>Low</span>
            <span><i style="background:var(--amber)"></i>Moderate</span>
            <span><i style="background:var(--red)"></i>High</span>
          </div>
        </div>
        ${renderHeatmap()}
      </div>
      <div class="side-panel">${renderCitizenSide()}</div>
    </div>

    <div class="global-strip">
      <div class="section-label">City-wide status</div>
      <div class="metric-grid">
        ${metricCard('Avg. surface temperature', m.avg+'°C','vs. citywide baseline','down')}
        ${metricCard('Temperature reduction to date', m.reduction+'°C','from completed projects','down')}
        ${metricCard('Mitigation projects', m.ongoing+' ongoing','+'+m.completed+' completed','down')}
        ${metricCard('Cooling-linked energy demand', m.energy+' GWh','vs. baseline','down')}
      </div>
      <div class="impact-link"><button class="pill-btn" onclick="openModal('impact')">View Before / After Impact Report ${ICONS.arrow}</button></div>
    </div>
  </div></div>
  `;
}
function seasonSeg(){
  return `<div class="seg">${Object.keys(SEASONS).map(k=>`<button class="${state.season===k?'active':''}" onclick="setState({season:'${k}'})">${SEASONS[k].label}</button>`).join('')}</div>`;
}
function renderCitizenSide(){
  if(state.analyzing){
    return `<div class="loading-state"><div class="spinner"></div><p>ANALYZING AREA…</p></div>`;
  }
  if(state.selectedHexId==null){
    return `<div class="side-empty">${ICONS.target}<p>Hover a hex for a quick reading, or click one to see a full area analysis.</p></div>`;
  }
  const city=getCity(state.city);
  const h=city.hexes.find(x=>x.id===state.selectedHexId);
  const adj=seasonAdjust(h,state.season);
  const risk=riskLevel(adj.temp,adj.aqi);
  const recs=recommendSolutions(h,adj);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <span class="risk-badge ${risk}"><span class="rdot"></span>${riskLabel(risk)}</span>
      <span class="mono" style="font-size:11px;color:var(--muted-2);">HEX ${String(h.id).padStart(3,'0')}</span>
    </div>
    <div class="readout-row">
      <div class="readout-cell"><div class="r-label">Temp</div><div class="r-value">${adj.temp}°</div></div>
      <div class="readout-cell"><div class="r-label">Humidity</div><div class="r-value">${adj.humidity}%</div></div>
      <div class="readout-cell"><div class="r-label">AQI</div><div class="r-value">${adj.aqi}</div></div>
    </div>
    <div class="side-block">
      <h5><span class="sq"></span>What's wrong with my area?</h5>
      <p>${h.mainProblem}</p>
      <div class="stat-inline">
        <span class="stat-chip">Tree cover ${h.treeCover}%</span>
        <span class="stat-chip">Built density ${h.builtDensity}%</span>
        <span class="stat-chip">Impervious ${h.imperviousSurface}%</span>
      </div>
    </div>
    <div class="side-block">
      <h5><span class="sq"></span>Mitigation work status</h5>
      ${h.hasProject?`<div class="proj-row"><span>${h.projName}</span><span class="status-tag ${h.projStatus}">${h.projStatus}</span></div>`
        :`<p>No mitigation project is currently logged for this pocket.</p>`}
    </div>
    <div class="side-block">
      <h5><span class="sq"></span>What can I do as a citizen?</h5>
      ${recs.slice(0,2).map(r=>`<div class="solution-card"><div class="s-top"><span class="s-name">${r.name}</span><span class="s-red">−${r.reduction}°C est.</span></div><div class="s-desc">${r.citizen}</div></div>`).join('')}
    </div>
    <button class="close-panel" onclick="setState({selectedHexId:null})">Close area analysis</button>
  `;
}

/* ---------------- planner portal ---------------- */
function renderPlanner(){
  const city=getCity(state.city);
  return `
  ${renderTopbar('Planner')}
  <div class="portal-header"><div class="wrap portal-header-inner">
    <div class="portal-title"><span class="badge">${ICONS.building} PLANNER</span><h2>${city.name} compliance workspace</h2></div>
    <div class="controls-row">
      ${citySearchHtml()}
      ${seasonSeg()}
    </div>
  </div></div>
  <div class="portal-body"><div class="wrap">
    <div class="section-label">Property type</div>
    <div class="law-tabs">
      ${Object.keys(LAWS).map(k=>`<button class="law-tab ${state.propertyType===k?'active':''}" onclick="setPropertyType('${k}')">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}
    </div>
    <div class="law-list">
      <h4>Heat-focused rules — ${state.propertyType}</h4>
      <ol>${LAWS[state.propertyType].map(r=>`<li>${r.t} <span style="color:var(--muted-2);">(${r.thresh})</span></li>`).join('')}</ol>
    </div>

    <div class="portal-grid">
      <div class="map-panel">
        <div class="map-panel-head">
          <h4>Select a plot on the thermal grid</h4>
          <div class="legend">
            <span><i style="background:var(--green)"></i>Low</span>
            <span><i style="background:var(--amber)"></i>Moderate</span>
            <span><i style="background:var(--red)"></i>High</span>
          </div>
        </div>
        ${renderHeatmap()}
      </div>
      <div class="side-panel">${renderPlannerSide()}</div>
    </div>
  </div></div>
  `;
}
function setPropertyType(t){ setState({propertyType:t, plannerResult:null}); }

function renderPlannerSide(){
  if(state.selectedHexId==null){
    return `<div class="side-empty">${ICONS.target}<p>Click a hex to select the plot you want to check for compliance.</p></div>`;
  }
  const city=getCity(state.city);
  const h=city.hexes.find(x=>x.id===state.selectedHexId);
  const adj=seasonAdjust(h,state.season);
  const risk=riskLevel(adj.temp,adj.aqi);

  if(state.plannerAnalyzing){
    return `<div class="loading-state"><div class="spinner"></div><p>CHECKING PLAN AGAINST HEAT RULES…</p></div>`;
  }

  let body='';
  if(state.plannerResult){
    const res=state.plannerResult;
    const ring=scoreRing(res.score);
    body=`
      <div class="score-wrap">
        ${ring}
        <div class="score-meta">
          <div class="rating">${res.ratingLabel}</div>
          <p>${res.passed}/${res.total} rules passed · ${res.violations.length} violation${res.violations.length===1?'':'s'}</p>
        </div>
      </div>
      <div class="side-block">
        <h5><span class="sq"></span>Rules checked</h5>
        ${res.checks.map(c=>`<div class="rule-row">
            <span class="rule-icon">${c.pass?ICONS.check:ICONS.x}</span>
            <div class="rule-text"><b>${c.t}</b><span>${c.thresh}</span>${!c.pass?`<span class="fix">Fix: ${SOLUTIONS[c.sol].name} — ${SOLUTIONS[c.sol].desc}</span>`:''}</div>
          </div>`).join('')}
      </div>
      <button class="close-panel" onclick="resetPlanner()">Check a different plot</button>
    `;
  } else {
    body=`
      <div class="side-block">
        <h5><span class="sq"></span>Selected plot</h5>
        <div class="stat-inline">
          <span class="stat-chip">Zone: ${h.zoneType}</span>
          <span class="stat-chip">${adj.temp}°C</span>
          <span class="stat-chip">${riskLabel(risk)}</span>
        </div>
      </div>
      <div class="side-block">
        <h5><span class="sq"></span>Upload building layout (.dwf)</h5>
        <div class="upload-zone ${state.dwfStatus==='ok'?'ok':state.dwfStatus==='err'?'err':''}">
          <label class="upload-label">${ICONS.upload} <span>${state.dwfName?state.dwfName:'Choose .dwf file'}</span>
            <input type="file" accept=".dwf" onchange="onDwfChange(this)"/>
          </label>
          ${state.dwfStatus==='ok'?`<div class="upload-msg ok">✓ ${state.dwfName} validated as a DWF layout file.</div>`:''}
          ${state.dwfStatus==='err'?`<div class="upload-msg err">✕ That file isn't a .dwf — please upload a DWF layout export.</div>`:''}
          <button class="sample-link" onclick="useSampleDwf()">Use sample layout instead</button>
        </div>
      </div>
      <button class="analyze-btn" ${state.dwfStatus==='ok'?'':'disabled'} onclick="runPlannerAnalysis()">Analyze Plan</button>
    `;
  }
  return body;
}
function scoreRing(score){
  const pct=score/10, r=32, c=2*Math.PI*r;
  const color = score>=8?'#5ee0aa':score>=6?'#f4c341':score>=4?'#f2a505':'#ff6b52';
  return `<div class="score-ring"><svg width="76" height="76" viewBox="0 0 76 76">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="#232a38" stroke-width="7"/>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"/>
  </svg><div class="score-num">${score}</div></div>`;
}
function onDwfChange(input){
  const f=input.files&&input.files[0];
  if(!f){ return; }
  if(/\.dwf$/i.test(f.name)){
    setState({dwfStatus:'ok', dwfName:f.name});
  } else {
    setState({dwfStatus:'err', dwfName:f.name});
  }
}
function useSampleDwf(){ setState({dwfStatus:'ok', dwfName:'sample_layout_plan.dwf'}); }
function resetPlanner(){ setState({selectedHexId:null, plannerResult:null, dwfStatus:null, dwfName:null}); }

function runPlannerAnalysis(){
  state.plannerAnalyzing=true; render();
  setTimeout(()=>{
    const city=getCity(state.city);
    const h=city.hexes.find(x=>x.id===state.selectedHexId);
    const rules=LAWS[state.propertyType];
    const checks=rules.map(r=>({...r, pass:r.test(h)}));
    const passed=checks.filter(c=>c.pass).length;
    const total=checks.length;
    const violations=checks.filter(c=>!c.pass);
    const score=Math.max(1, +((passed/total)*10).toFixed(1));
    const ratingLabel = score>=8?'Excellent compliance':score>=6?'Good, minor gaps':score>=4?'Needs improvement':'Poor — major violations';
    state.plannerResult={checks,passed,total,violations,score,ratingLabel};
    state.plannerAnalyzing=false;
    render();
  }, 1100);
}

/* ---------------- impact modal ---------------- */
function renderModal(){
  if(state.modal!=='impact') return '';
  const city=getCity(state.city);
  const beforeTemps=city.hexes.map(h=>h.baseTemp+2.1);
  const afterTemps=city.hexes.map(h=>{
    const dip = h.hasProject ? (h.projStatus==='completed'?2.3:1.0) : 0.3;
    return h.baseTemp - dip;
  });
  const avgBefore=+(beforeTemps.reduce((a,b)=>a+b,0)/beforeTemps.length).toFixed(1);
  const avgAfter=+(afterTemps.reduce((a,b)=>a+b,0)/afterTemps.length).toFixed(1);
  const miniGrid=(temps)=>`<div class="mini-grid">${temps.map(t=>`<div class="mini-cell" style="background:${tempToColor(t)}"></div>`).join('')}</div>`;
  const m=globalMetrics();
  return `<div class="modal-backdrop" onclick="closeModalBg(event)">
    <div class="modal" role="dialog" aria-label="Before and after impact report">
      <div class="modal-head">
        <div><h3>Before / After Impact Report</h3><p>${city.name} · cumulative effect of logged mitigation projects</p></div>
        <button class="modal-close" onclick="closeModal()">${ICONS.close}</button>
      </div>
      <div class="compare-row">
        <div class="compare-card"><div class="c-label">Before mitigation</div>${miniGrid(beforeTemps)}<div class="c-temp">${avgBefore}°C</div></div>
        <div class="compare-card"><div class="c-label">Current state</div>${miniGrid(afterTemps)}<div class="c-temp">${avgAfter}°C</div></div>
      </div>
      <div class="impact-stats">
        <div class="i-card"><div class="i-label">Peak temperature cut</div><div class="i-val">−${(avgBefore-avgAfter).toFixed(1)}°C</div></div>
        <div class="i-card"><div class="i-label">Completed projects</div><div class="i-val">${m.completed}</div></div>
        <div class="i-card"><div class="i-label">Cooling energy saved</div><div class="i-val">~${Math.round(m.completed*38)} MWh/yr</div></div>
      </div>
    </div>
  </div>`;
}
function openModal(name){ state.modal=name; renderModalOnly(); }
function closeModal(){ state.modal=null; renderModalOnly(); }
function closeModalBg(ev){ if(ev.target.classList.contains('modal-backdrop')) closeModal(); }
function renderModalOnly(){ document.getElementById('modal-root').innerHTML=renderModal(); }

/* ---------------- routing ---------------- */
function goHome(){ setState({route:'landing', selectedHexId:null, plannerResult:null}); window.scrollTo(0,0); }
function goRoute(r){ setState({route:r, selectedHexId:null, plannerResult:null}); window.scrollTo(0,0); }

/* ---------------- main render ---------------- */
function render(){
  const root=document.getElementById('app');
  let html='';
  if(state.route==='landing') html=renderLanding();
  else if(state.route==='citizen') html=renderCitizen();
  else if(state.route==='planner') html=renderPlanner();
  root.innerHTML=html;
  renderModalOnly();
}
render();
</script>
</body>
</html>
